<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사케로드 — 카탈로그</title>
<style>
  :root{
    --bg:#0d0d0d;--panel:#161616;--card:#1a1a1a;--cardb:#2e2e2e;--hero:#000;
    --tx:#f2f2f2;--dim:#9a9a9a;--dimmer:#6f6f6f;--line:#333;--bubble:#262626;
    --track:#3a3a3a;--knob:#e8e8e8;
    --grn-bg:#13351c;--grn:#5fc27e;--blu-bg:#16263f;--blu:#69a8e8;--amb-bg:#3a2e12;--amb:#d9b54a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;padding-bottom:60px;}
  header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px;}
  .h-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h1{font-size:19px;font-weight:700;}
  .cnt{font-size:13px;color:var(--dim);}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;align-items:center;}
  input[type=text]{background:#0d0d0d;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 12px;font-size:15px;min-width:140px;flex:1;}
  select{background:#0d0d0d;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 10px;font-size:14px;}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{background:#0d0d0d;border:none;color:var(--dim);padding:9px 12px;font-size:13px;cursor:pointer;}
  .seg button.on{background:#2a2a2a;color:var(--tx);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;padding:16px;}
  .rg-h{grid-column:1/-1;font-size:14px;color:var(--dim);margin:8px 2px 0;border-top:1px solid var(--line);padding-top:13px;}
  .mini{background:var(--card);border:1px solid var(--cardb);border-radius:12px;padding:13px;cursor:pointer;position:relative;}
  .mini:active{border-color:#555;}
  .mini .chip{font-size:10px;color:var(--dimmer);}
  .mini .nm{font-size:16px;font-weight:700;margin-top:3px;letter-spacing:-.3px;}
  .mini .rd{font-size:12px;color:var(--dim);margin-top:2px;}
  .mini .mk{font-size:11px;color:var(--dimmer);margin-top:4px;}
  .mini .tags{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;}
  .pill{font-size:10px;font-weight:600;padding:3px 8px;border-radius:11px;}
  .pill.l1{background:var(--grn-bg);color:var(--grn);}
  .pill.l2{background:var(--blu-bg);color:var(--blu);}
  .pill.l3{background:var(--amb-bg);color:var(--amb);}
  .pill.tag{background:#242424;color:var(--dim);}
  .tasted{position:absolute;top:11px;right:11px;font-size:10px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .tasted.y{background:var(--grn-bg);color:var(--grn);}
  .tasted.n{background:#222;color:var(--dimmer);}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:24px 10px;}
  .ov.show{display:flex;}
  .full{width:100%;max-width:400px;background:var(--card);border:1px solid var(--cardb);border-radius:16px;overflow:hidden;position:relative;}
  .full .x{position:absolute;top:14px;right:16px;color:var(--dim);font-size:24px;cursor:pointer;z-index:2;}
  .crumb{padding:15px 16px;color:var(--dim);font-size:13px;}
  .hero{background:var(--hero);height:220px;display:flex;align-items:center;justify-content:center;}
  .fbody{padding:18px 16px 22px;}
  .ftitle{font-size:24px;font-weight:700;}
  .fread{font-size:15px;margin-top:5px;}
  .fmaker{font-size:12px;color:var(--dim);margin-top:5px;}
  .fbadges{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap;}
  .stat{font-size:11px;padding:4px 10px;border-radius:11px;background:#242424;color:var(--dim);}
  .stat.tasted-y{background:var(--grn-bg);color:var(--grn);}
  .stat.est{background:var(--amb-bg);color:var(--amb);}
  .stat.cf{background:var(--blu-bg);color:var(--blu);}
  .bubble{margin-top:16px;background:var(--bubble);border-left:4px solid #444;padding:15px 17px;font-size:16px;line-height:1.5;}
  .axes{margin-top:20px;display:flex;flex-direction:column;gap:14px;}
  .axis{display:grid;grid-template-columns:58px 1fr 64px;align-items:center;gap:9px;}
  .axis .l{font-size:13px;color:var(--dim);text-align:right;}
  .axis .r{font-size:13px;color:var(--dim);}
  .axis .bar{position:relative;height:3px;background:var(--track);border-radius:2px;}
  .axis .k{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--knob);transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(0,0,0,.35);}
  .noax{margin-top:18px;color:var(--dimmer);font-size:13px;font-style:italic;border:1px dashed var(--line);border-radius:8px;padding:13px;text-align:center;}
  .meta{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;color:var(--dimmer);font-size:12px;}
  .ebtn{margin-top:16px;width:100%;background:var(--blu-bg);color:var(--blu);border:1px solid #2f5a8c;border-radius:9px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;}
  .ef{margin-top:8px;display:flex;flex-direction:column;gap:15px;}
  .ef label{font-size:13px;color:var(--dim);display:block;margin-bottom:7px;}
  .seg2{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg2 button{flex:1;background:#0d0d0d;border:none;color:var(--dim);padding:11px;font-size:14px;cursor:pointer;}
  .seg2 button.on{background:#2a2a2a;color:var(--tx);}
  .axr{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;gap:8px;font-size:12px;color:var(--dim);}
  .axr input[type=range]{width:100%;}
  .ef input[type=date],.ef textarea{width:100%;background:#0d0d0d;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px;font-size:14px;font-family:inherit;}
  .ef textarea{min-height:64px;resize:vertical;}
  .ef .save{background:var(--grn-bg);color:var(--grn);border:1px solid #2e6b41;border-radius:9px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;}
  .expbtn{background:#0d0d0d;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer;}
</style>
</head>

</header>
<div class="grid" id="grid"></div>
<div class="ov" id="ov"><div class="full" id="full"></div></div>

const LSK="sakeroad_overrides_v1";
const NEWK="sakeroad_added_v1";
let OV={};try{OV=JSON.parse(localStorage.getItem(LSK)||"{}");}catch(e){}
let NEW=[];try{NEW=JSON.parse(localStorage.getItem(NEWK)||"[]");}catch(e){}
NEW.forEach(s=>CATALOG.push(s));
CATALOG.forEach(s=>{if(OV[s.n])Object.assign(s,OV[s.n]);});
function curRegions(){const base=[...new Set(CATALOG.map(s=>s.r))];if(base.indexOf('미분류')>-1){return base.filter(r=>r!=='미분류').concat('미분류');}return base;}
const fil={q:"",region:"all",tasted:"all",tier:"all"};
const $=s=>document.querySelector(s);
const rsel=$("#region");
function refreshRegions(){rsel.innerHTML='<option value="all">전 권역</option>'+curRegions().map(r=>`<option value="${r}"${fil.region===r?' selected':''}>${r}</option>`).join("");}
refreshRegions();
let pendingPhoto="";
function bottleSVG(s){return `<svg width="105" height="200" viewBox="0 0 120 230"><path d="M50 8 h20 v40 q0 6 6 12 l10 14 q6 8 6 20 v110 q0 12 -12 12 h-40 q-12 0 -12 -12 v-110 q0 -12 6 -20 l10 -14 q6 -6 6 -12 v-40 z" fill="none" stroke="#7a7a7a" stroke-width="1.5"/><rect x="40" y="100" width="40" height="34" fill="none" stroke="#7a7a7a" stroke-width="1.2"/><text x="60" y="118" fill="#9a9a9a" font-size="16" text-anchor="middle">${s.n.slice(0,3)}</text></svg>`;}
function heroHTML(s){
  if(s.photo) return `<div style="position:relative;width:100%;height:100%"><img src="${s.photo}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;left:0;right:0;bottom:0;padding:16px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.82));font-size:22px;font-weight:700;color:#fff">${s.n}</div></div>`;
  return bottleSVG(s);
}
function loadPhoto(file,cb){
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{
    const max=640;let w=img.width,h=img.height;
    if(w>max||h>max){const sc=max/Math.max(w,h);w=Math.round(w*sc);h=Math.round(h*sc);}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    cb(cv.toDataURL('image/jpeg',0.72));
  };img.src=e.target.result;};
  r.readAsDataURL(file);
}
function pillCls(L){return L==="L1"?"l1":L==="L2"?"l2":"l3";}
function match(s){
  if(fil.region!=="all"&&s.r!==fil.region)return false;
  if(fil.tasted!=="all"&&s.x!==fil.tasted)return false;
  if(fil.tier!=="all"&&s.L!==fil.tier)return false;
  if(fil.q){const q=fil.q.toLowerCase();if(!(`${s.n} ${s.k} ${s.m} ${s.p} ${s.c} ${s.r}`.toLowerCase().includes(q)))return false;}
  return true;
}
function mini(s,i){
  const thumb=s.photo?`<img src="${s.photo}" style="width:100%;height:96px;object-fit:cover;border-radius:8px;margin-bottom:9px">`:"";
  return `<div class="mini" onclick="openCard(${i})"><div class="tasted ${s.x==='○'?'y':'n'}">${s.x}</div>${thumb}
    <div class="chip">${s.r} · ${s.p} ${s.c}</div><div class="nm">${s.n}</div><div class="rd">${s.k}</div>
    <div class="mk">${s.m} · ${s.g}</div><div class="tags"><span class="pill ${pillCls(s.L)}">${s.L}</span>
    <span class="pill tag">${s.t}</span>${s.pf==='확정'?'<span class="pill l2">확정</span>':'<span class="pill tag">추정</span>'}</div></div>`;
}
function draw(){
  const list=CATALOG.map((s,i)=>({s,i})).filter(o=>match(o.s));
  $("#cnt").textContent=`${list.length} / ${CATALOG.length}종`;
  let html="";
  if(fil.region==="all"){
    curRegions().forEach(r=>{const rows=list.filter(o=>o.s.r===r);if(!rows.length)return;
      html+=`<div class="rg-h">${r} (${rows.length})</div>`+rows.map(o=>mini(o.s,o.i)).join("");});
  }else{html=list.map(o=>mini(o.s,o.i)).join("");}
  $("#grid").innerHTML=html||'<div class="rg-h">해당하는 술이 없어요</div>';
}
function axisRow(a,l){return `<div class="axis"><div class="l">${l[0]}</div><div class="bar"><div class="k" style="left:${a*100}%"></div></div><div class="r">${l[1]}</div></div>`;}
function openCard(i){
  const s=CATALOG[i];
  const L=[["단맛","드라이"],["가벼움","묵직"],["부드러움","상큼함"],["담백","화려한 향"]];
  const distilled=s.ty==='아와모리'||s.ty.indexOf('焼酎')>-1||s.ty.indexOf('소주')>-1;
  const axes=s.a?`<div class="axes">${s.a.map((v,j)=>axisRow(v,L[j])).join("")}</div>`:`<div class="noax">${distilled?'증류주 — 사케 4축 미적용':'시음 전 — 4축 프로필 추정 대기'}</div>`;
  $("#full").innerHTML=`<span class="x" onclick="closeCard()">✕</span>
    <div class="crumb">${s.r} · ${s.p} ${s.c}</div>
    <div class="hero">${heroHTML(s)}</div>
    <div class="fbody"><div class="ftitle">${s.n}</div><div class="fread">${s.k}</div><div class="fmaker">${s.m} · ${s.g} · ${s.ty}</div>
    <div class="fbadges"><span class="pill ${pillCls(s.L)}">${s.L}</span><span class="pill tag">${s.t}</span>
    <span class="stat ${s.x==='○'?'tasted-y':''}">${s.x==='○'?'마셔봄':'안마셔봄'}</span>
    <span class="stat ${s.pf==='확정'?'cf':'est'}">${s.pf} 프로필</span></div>
    <div class="bubble">${s.d}</div>${axes}
    <div class="meta">상태: ${s.s} · 앵커/확정은 시음 기반, 추정은 자료 기반</div>
    <button class="ebtn" onclick="editCard(${i})">✎ 기록·큐레이팅</button></div>`;
  $("#ov").classList.add("show");
}
function closeCard(){$("#ov").classList.remove("show");}
function editCard(i){
  const s=CATALOG[i];const L=[["단맛","드라이"],["가벼움","묵직"],["부드러움","상큼함"],["담백","화려한 향"]];
  const a=s.a||[0.5,0.5,0.5,0.5];
  $("#full").innerHTML=`<span class="x" onclick="openCard(${i})">✕</span>
    <div class="crumb">${s.r} · ${s.n}</div>
    <div class="fbody"><div class="ftitle" style="font-size:20px">기록·큐레이팅</div>
    <div class="ef">
      <div><label>마셔봤나요?</label><div class="seg2" id="e_x"><button data-v="○" class="${s.x==='○'?'on':''}">마셔봄</button><button data-v="✗" class="${s.x==='✗'?'on':''}">안마셔봄</button></div></div>
      <div><label>마신 날짜</label><input type="date" id="e_date" value="${s.date||''}"></div>
      <div><label>사진 (카드 최상단에 이름과 함께 표시)</label>
        <div id="e_prev">${s.photo?`<img src="${s.photo}" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px">`:'<span style="color:#6f6f6f;font-size:13px">등록된 사진 없음</span>'}</div>
        <input type="file" accept="image/*" id="e_photo" style="margin-top:8px;color:#9a9a9a;font-size:13px;width:100%">
        <button type="button" class="expbtn" id="e_photo_clear" style="margin-top:8px">사진 제거</button>
      </div>
      <div><label>프로필</label><div class="seg2" id="e_pf"><button data-v="확정" class="${s.pf==='확정'?'on':''}">확정(시음)</button><button data-v="추정" class="${s.pf==='추정'?'on':''}">추정</button></div></div>
      <div><label>4축 (왼쪽 0 ~ 오른쪽 100)</label>
      ${a.map((v,j)=>`<div class="axr" style="margin-top:6px"><span style="text-align:right">${L[j][0]}</span><input type="range" min="0" max="100" value="${Math.round(v*100)}" id="e_a${j}"><span>${L[j][1]}</span></div>`).join("")}</div>
      <div><label>한 줄 평·메모</label><textarea id="e_d">${s.d||''}</textarea></div>
      <button class="save" onclick="saveEdit(${i})">저장</button>
    </div></div>`;
  ['e_x','e_pf'].forEach(id=>document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));}));
  pendingPhoto=s.photo||"";
  const pin=document.getElementById('e_photo');
  if(pin)pin.onchange=e=>{const f=e.target.files[0];if(!f)return;loadPhoto(f,d=>{pendingPhoto=d;document.getElementById('e_prev').innerHTML=`<img src="${d}" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px">`;});};
  const pc=document.getElementById('e_photo_clear');
  if(pc)pc.onclick=()=>{pendingPhoto="";document.getElementById('e_prev').innerHTML='<span style="color:#6f6f6f;font-size:13px">등록된 사진 없음</span>';};
}
function saveEdit(i){
  const s=CATALOG[i];
  const x=(document.querySelector('#e_x button.on')||{}).dataset?document.querySelector('#e_x button.on').dataset.v:s.x;
  const pf=(document.querySelector('#e_pf button.on')||{}).dataset?document.querySelector('#e_pf button.on').dataset.v:s.pf;
  const date=$("#e_date").value;
  const a=[0,1,2,3].map(j=>(+document.getElementById('e_a'+j).value)/100);
  const d=$("#e_d").value;
  const patch={x,pf,date,a,d,photo:pendingPhoto};
  OV[s.n]=Object.assign({},OV[s.n],patch);
  try{localStorage.setItem(LSK,JSON.stringify(OV));}catch(e){alert('저장 실패 — 사진 용량으로 저장 공간이 찼을 수 있어요. 사진을 줄이거나 일부 기록을 내보낸 뒤 다시 시도하세요.');}
  Object.assign(CATALOG[i],patch);
  draw();openCard(i);
}
function exportOV(){
  const data={overrides:OV,added:NEW};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="사케로드_내기록.json";document.body.appendChild(a);a.click();a.remove();
}
function wirePhoto(){
  const pin=document.getElementById('e_photo');
  if(pin)pin.onchange=e=>{const f=e.target.files[0];if(!f)return;loadPhoto(f,d=>{pendingPhoto=d;document.getElementById('e_prev').innerHTML=`<img src="${d}" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px">`;});};
  const pc=document.getElementById('e_photo_clear');
  if(pc)pc.onclick=()=>{pendingPhoto="";document.getElementById('e_prev').innerHTML='<span style="color:#6f6f6f;font-size:13px">등록된 사진 없음</span>';};
}
function openNew(){
  pendingPhoto="";
  const Ls=[["단맛","드라이"],["가벼움","묵직"],["부드러움","상큼함"],["담백","화려한 향"]];
  const regOpts=['미분류',...curRegions().filter(r=>r!=='미분류')].map(r=>`<option>${r}</option>`).join("");
  $("#full").innerHTML=`<span class="x" onclick="closeCard()">✕</span>
   <div class="crumb">새 술 추가</div>
   <div class="fbody"><div class="ftitle" style="font-size:20px">새 술 등록</div>
   <div class="ef">
     <div><label>이름 (한자/원어) *</label><input type="text" id="n_name" placeholder="예: 飛露喜 特別純米"></div>
     <div><label>읽기 (한글)</label><input type="text" id="n_read" placeholder="예: 히로키 토쿠베쓰준마이"></div>
     <div><label>양조장</label><input type="text" id="n_maker" placeholder="예: 廣木酒造本店"></div>
     <div><label>권역 (모르면 미분류)</label><select id="n_region">${regOpts}</select></div>
     <div><label>도도부현·지역</label><input type="text" id="n_pref" placeholder="예: 福島県 会津坂下町"></div>
     <div><label>등급</label><input type="text" id="n_grade" placeholder="예: 特別純米"></div>
     <div><label>입수난이도</label><div class="seg2" id="n_L"><button data-v="L1">L1</button><button data-v="L2" class="on">L2</button><button data-v="L3">L3</button></div></div>
     <div><label>추천태그</label><input type="text" id="n_tag" placeholder="예: 입문·식중주"></div>
     <div><label>사진 (카드 최상단에 이름과 함께 표시)</label><div id="e_prev"><span style="color:#6f6f6f;font-size:13px">등록된 사진 없음</span></div><input type="file" accept="image/*" id="e_photo" style="margin-top:8px;width:100%;color:#9a9a9a;font-size:13px"><button type="button" class="expbtn" id="e_photo_clear" style="margin-top:8px">사진 제거</button></div>
     <div><label>마셔봤나요?</label><div class="seg2" id="n_x"><button data-v="○">마셔봄</button><button data-v="✗" class="on">안마셔봄</button></div></div>
     <div><label>4축 (왼쪽 0 ~ 오른쪽 100)</label>${Ls.map((l,j)=>`<div class="axr" style="margin-top:6px"><span style="text-align:right">${l[0]}</span><input type="range" min="0" max="100" value="50" id="n_a${j}"><span>${l[1]}</span></div>`).join("")}</div>
     <div><label>한 줄 평·메모</label><textarea id="n_d"></textarea></div>
     <button class="save" onclick="saveNew()">추가</button>
   </div></div>`;
  ['n_L','n_x'].forEach(id=>document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));}));
  wirePhoto();
  $("#ov").classList.add("show");
}
function saveNew(){
  const name=$("#n_name").value.trim();
  if(!name){alert('이름을 입력하세요');return;}
  const x=(document.querySelector('#n_x button.on')||{dataset:{v:'✗'}}).dataset.v;
  const L=(document.querySelector('#n_L button.on')||{dataset:{v:'L2'}}).dataset.v;
  const a=[0,1,2,3].map(j=>(+document.getElementById('n_a'+j).value)/100);
  const item={r:$("#n_region").value||'미분류',p:$("#n_pref").value,c:"",m:$("#n_maker").value,n:name,k:$("#n_read").value,g:$("#n_grade").value||"-",ty:"정번주",L:L,t:$("#n_tag").value||"신규",x:x,pf:(x==='○'?'확정':'추정'),d:$("#n_d").value,s:"draft",isNew:true,a:a,photo:pendingPhoto};
  NEW.push(item);
  try{localStorage.setItem(NEWK,JSON.stringify(NEW));}catch(e){alert('저장 실패 — 저장공간 부족. 사진을 줄이거나 기록을 내보낸 뒤 다시 시도하세요.');NEW.pop();return;}
  CATALOG.push(item);
  closeCard();refreshRegions();draw();
}
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeCard();});
$("#q").addEventListener("input",e=>{fil.q=e.target.value;draw();});
rsel.addEventListener("change",e=>{fil.region=e.target.value;draw();});
document.querySelectorAll("#tasted button").forEach(b=>b.onclick=()=>{fil.tasted=b.dataset.v;document.querySelectorAll("#tasted button").forEach(x=>x.classList.toggle("on",x===b));draw();});
document.querySelectorAll("#tier button").forEach(b=>b.onclick=()=>{fil.tier=b.dataset.v;document.querySelectorAll("#tier button").forEach(x=>x.classList.toggle("on",x===b));draw();});
$("#exp").onclick=exportOV;
$("#add").onclick=openNew;
draw();
</script>
</body>
</html>
